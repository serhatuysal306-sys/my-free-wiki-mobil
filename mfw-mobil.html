<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>My Free Wiki</title>
<style>
  :root { --red:#c8102e; --dark:#7a0a1c; --bg:#faf6f1; --ink:#222; --muted:#666; --line:#e6dccf; --gold:#b8922f; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.55; }
  header { background:var(--red); color:#fff; padding:16px 16px 12px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:20px; }
  header .sub { font-size:13px; color:#ffe3e6; margin-top:2px; }
  .row { display:flex; gap:8px; margin-top:10px; }
  input[type=search] { flex:1; min-width:0; font-size:16px; padding:10px 12px; border:0; border-radius:10px; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 12px; cursor:pointer; }
  .btn-open { background:#fff; color:var(--dark); font-weight:700; white-space:nowrap; }
  .btn-ghost { background:#d9475d; color:#fff; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-top:10px; padding-bottom:2px; }
  .tab { background:#d9475d; color:#fff; white-space:nowrap; padding:6px 10px; font-size:14px; border-radius:999px; }
  .tab.on { background:#fff; color:var(--dark); font-weight:700; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin-top:8px; }
  .chip { background:#d9475d; color:#fff; white-space:nowrap; padding:5px 10px; font-size:13px; border-radius:999px; }
  main { padding:12px 14px 80px; max-width:720px; margin:0 auto; }
  h2 { color:var(--dark); font-size:19px; margin:26px 0 4px; border-top:3px solid var(--red); padding-top:8px; }
  .lead { color:var(--muted); font-size:14px; margin:0 0 10px; }
  .card { background:var(--card); border-left:4px solid var(--red); border-radius:8px; padding:10px 12px; margin:10px 0; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .card h3 { margin:0 0 4px; font-size:16px; color:var(--dark); }
  .card p { margin:4px 0; }
  .badge { display:inline-block; background:var(--gold); color:#fff; font-size:12px; font-weight:700; padding:1px 7px; border-radius:6px; margin-right:6px; }
  .quote { border-left-color:var(--gold); font-style:italic; }
  .cite { color:var(--muted); font-size:13px; font-style:normal; }
  .year-btn { display:inline-block; background:var(--gold); color:#fff; border:0; border-radius:6px; padding:3px 8px; margin:3px; font-size:14px; }
  .letters { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
  .letters span { padding:3px 7px; border:1px solid var(--line); border-radius:6px; font-size:14px; color:var(--muted); }
  .letters a { padding:3px 7px; border:1px solid var(--line); border-radius:6px; font-size:14px; color:var(--dark); background:#fff; text-decoration:none; font-weight:700; }
  .letter-head { background:var(--red); color:#fff; display:inline-block; padding:2px 10px; border-radius:6px; font-weight:700; margin-top:14px; }
  mark { background:#ffe066; color:#000; border-radius:3px; }
  .empty { text-align:center; padding:50px 10px; color:var(--muted); }
  .empty button { background:var(--red); color:#fff; font-size:17px; padding:12px 20px; margin-top:12px; }
  .msg { background:#fff3cd; border:1px solid #f0d78a; padding:8px 10px; border-radius:8px; margin:10px 0; font-size:14px; }
  .fs { display:flex; gap:6px; align-items:center; justify-content:flex-end; font-size:13px; color:var(--muted); }
  .fs button { background:#fff; border:1px solid var(--line); padding:4px 10px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:8px 12px; display:flex; gap:8px; justify-content:center; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
  footer button { background:var(--red); color:#fff; }
  footer button.sec { background:#eee; color:#333; }
</style>
</head>
<body>

<header>
  <h1 id="ttl">My Free Wiki</h1>
  <div class="sub" id="sub">Kendi dosya formatıyla çalışan ücretsiz, internetsiz mini wiki</div>
  <div class="row">
    <input type="search" id="q" placeholder="Ara… (Türkçe karakter duyarsız)" autocomplete="off">
    <button class="btn-open" id="openBtn">📂 Aç</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<footer>
  <button class="sec" id="fsDown">A−</button>
  <button class="sec" id="fsUp">A+</button>
  <button class="sec" id="rmBtn">Kaldır</button>
</footer>

<input type="file" id="file" accept=".mfw,.json,application/json" multiple hidden>

<script>
(function () {
  "use strict";

  var TBL = { "ı":"i","ç":"c","ğ":"g","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u","İ":"i","I":"i","Ç":"c","Ğ":"g","Ö":"o","Ş":"s","Ü":"u" };
  function fold(s) {
    return String(s).replace(/[ıçğöşüâîûİIÇĞÖŞÜ]/g, function (c) { return TBL[c]; }).toLowerCase();
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function upperLetter(ch) {
    if (ch === "i") return "İ";
    if (ch === "ı") return "I";
    return ch.toLocaleUpperCase("tr-TR");
  }

  var wikis = [];      // {data, items, name}
  var cur = -1;
  var query = "";
  var fs = 16;
  var openYears = {};  // key -> true
  var KEY = "mfw_library_v1";

  // ---------- kayıt (localStorage; hata olursa sessizce atla) ----------
  function saveLib() {
    try {
      localStorage.setItem(KEY, JSON.stringify(wikis.map(function (w) { return { name: w.name, data: w.data }; })));
    } catch (e) {}
  }
  function loadLib() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) JSON.parse(raw).forEach(function (w) { addWiki(w.data, w.name, true); });
    } catch (e) {}
    try { fs = Math.max(12, Math.min(26, parseInt(localStorage.getItem("mfw_fs"), 10) || 16)); } catch (e) {}
    if (wikis.length) cur = 0;
  }

  // ---------- ayrıştırma ----------
  function prepare(data, name) {
    var items = [];
    data.sections.forEach(function (sec, si) {
      var typ = sec.type || "n";
      var its = sec.items || [];
      if (typ === "g") its = its.slice().sort(function (a, b) { return fold(a.title || "") < fold(b.title || "") ? -1 : 1; });
      its.forEach(function (it, ii) {
        var o = { si: si, ii: ii, sec: sec, type: typ, title: it.title || it.text || "", tag: it.tag || "",
                  year: it.year || "", note: it.note || "", events: it.events || [],
                  paras: typ === "q" ? [] : String(it.text || "").split("||") };
        if (typ === "q") o.title = it.text || "";
        o.idx = fold([o.title, o.tag, o.year, o.paras.join(" "), o.events.join(" "), o.note,
                      it.keywords || "", sec.title || ""].join(" "));
        items.push(o);
      });
    });
    return { data: data, items: items, name: name };
  }
  function addWiki(data, name, quiet) {
    if (!data || data.format !== "MyFreeWiki" || !Array.isArray(data.sections)) {
      if (!quiet) alert((name || "Dosya") + " bir My Free Wiki (.mfw) dosyası değil.");
      return false;
    }
    var w = prepare(data, name || "wiki.mfw");
    wikis = wikis.filter(function (x) { return x.name !== w.name; });
    wikis.push(w);
    cur = wikis.length - 1;
    saveLib();
    return true;
  }

  // ---------- çizim ----------
  function mark(text, words) {
    var t = esc(text);
    if (!words.length) return t;
    // basit ve güvenli vurgulama: eşleşmeleri katlanmış metin üzerinde bul
    var f = fold(text);
    if (f.length !== text.length) return t;
    var ranges = [];
    words.forEach(function (w) {
      var p = 0;
      while ((p = f.indexOf(w, p)) >= 0) { ranges.push([p, p + w.length]); p += w.length; }
    });
    if (!ranges.length) return t;
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var out = "", pos = 0;
    ranges.forEach(function (r) {
      if (r[0] < pos) return;
      out += esc(text.slice(pos, r[0])) + "<mark>" + esc(text.slice(r[0], r[1])) + "</mark>";
      pos = r[1];
    });
    return out + esc(text.slice(pos));
  }
  function paras(list, words) {
    return list.filter(function (p) { return p.trim(); }).map(function (p) {
      return "<p>" + mark(p, words) + "</p>";
    }).join("");
  }
  function itemHtml(o, words, showSec) {
    var secTag = showSec ? ' <span class="cite">· ' + esc(o.sec.title || "") + "</span>" : "";
    if (o.type === "q") {
      return '<div class="card quote"><p>“' + mark(o.title, words) + '”</p>' +
             (o.note ? '<p class="cite">— ' + mark(o.note, words) + "</p>" : "") + "</div>";
    }
    if (o.type === "y") {
      var key = o.si + "_" + o.ii;
      var opened = openYears[key] || words.length > 0;
      var evs = opened ? o.events.map(function (e) { return "<p>• " + mark(e, words) + "</p>"; }).join("") : "";
      return '<div class="card"><h3><span class="badge">' + esc(o.year) + "</span>" + mark(o.title, words) + secTag + "</h3>" +
             (opened ? paras(o.paras, words) + evs : '<p class="cite">Açmak için yıla dokunun.</p>') + "</div>";
    }
    var pre = o.type === "f" ? "S: " : "";
    return '<div class="card"><h3>' + (o.tag ? '<span class="badge">' + esc(o.tag) + "</span>" : "") +
           mark(pre + o.title, words) + secTag + "</h3>" + paras(o.paras, words) + "</div>";
  }

  function render() {
    var main = document.getElementById("main");
    var w = wikis[cur];
    document.getElementById("ttl").textContent = w ? (w.data.title || w.name) : "My Free Wiki";
    document.getElementById("sub").textContent = w ? (w.data.subtitle || "") : "Kendi dosya formatıyla çalışan ücretsiz, internetsiz mini wiki";
    document.getElementById("rmBtn").style.display = w ? "" : "none";
    main.style.fontSize = fs + "px";
    renderTabs();
    renderChips();

    if (!w) {
      main.innerHTML = '<div class="empty"><p><strong>Henüz bir wiki açılmadı.</strong></p><p>Bir .mfw dosyası seçerek başlayın.</p>' +
                       '<button id="emptyOpen">📂 .mfw dosyası aç</button></div>';
      document.getElementById("emptyOpen").onclick = openDialog;
      return;
    }
    var words = query ? fold(query).split(/\s+/).filter(Boolean) : [];
    if (words.length) return renderSearch(words, main);

    var html = "";
    w.data.sections.forEach(function (sec, si) {
      var its = w.items.filter(function (o) { return o.si === si; });
      html += '<h2 id="s' + si + '">' + esc(sec.title || "") + "</h2>";
      if (sec.lead) html += '<p class="lead">' + esc(sec.lead) + "</p>";
      if (sec.type === "y" && its.length) {
        html += its.map(function (o) {
          return '<button class="year-btn" data-year="' + o.si + "_" + o.ii + '">' + esc(o.year) + "</button>";
        }).join("");
      }
      if (sec.type === "g" && its.length) {
        var have = {};
        its.forEach(function (o) { have[upperLetter(o.title.charAt(0))] = true; });
        var letters = "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ".split("");
        html += '<div class="letters">' + letters.map(function (c) {
          return have[c] ? '<a href="#l' + si + "_" + encodeURIComponent(c) + '">' + c + "</a>" : "<span>" + c + "</span>";
        }).join("") + "</div>";
      }
      var prev = "";
      its.forEach(function (o) {
        if (sec.type === "g") {
          var L = upperLetter(o.title.charAt(0));
          if (L !== prev) { html += '<div class="letter-head" id="l' + si + "_" + encodeURIComponent(L) + '">' + L + "</div>"; prev = L; }
        }
        html += '<div id="m' + o.si + "_" + o.ii + '">' + itemHtml(o, [], false) + "</div>";
      });
    });
    main.innerHTML = html;
  }

  function renderSearch(words, main) {
    var total = 0, html = "";
    wikis.forEach(function (w) {
      var hits = w.items.filter(function (o) {
        return words.every(function (x) { return o.idx.indexOf(x) >= 0; });
      });
      if (!hits.length) return;
      total += hits.length;
      html += "<h2>" + esc(w.data.title || w.name) + " (" + hits.length + ")</h2>";
      hits.slice(0, 200).forEach(function (o) { html += itemHtml(o, words, true); });
    });
    main.innerHTML = total
      ? '<p class="lead">' + total + " sonuç bulundu: “" + esc(query) + "”</p>" + html
      : '<div class="empty"><p><strong>Sonuç bulunamadı</strong></p><p>Başka bir kelime deneyin.</p></div>';
  }

  function renderTabs() {
    document.getElementById("tabs").innerHTML = wikis.map(function (w, i) {
      return '<button class="tab' + (i === cur ? " on" : "") + '" data-tab="' + i + '">' + esc(w.data.title || w.name) + "</button>";
    }).join("");
  }
  function renderChips() {
    var w = wikis[cur];
    document.getElementById("chips").innerHTML = w && w.data.suggest
      ? w.data.suggest.slice(0, 14).map(function (s) {
          return '<button class="chip" data-chip="' + esc(s) + '">' + esc(s) + "</button>";
        }).join("")
      : "";
  }

  // ---------- olaylar ----------
  function openDialog() { document.getElementById("file").click(); }

  document.getElementById("openBtn").onclick = openDialog;
  document.getElementById("file").onchange = function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    files.forEach(function (f) {
      var reader = new FileReader();
      reader.onload = function () {
        try { addWiki(JSON.parse(String(reader.result).replace(/^﻿/, "")), f.name, false); }
        catch (err) { alert(f.name + " okunamadı: " + err.message); }
        query = ""; document.getElementById("q").value = "";
        render();
      };
      reader.readAsText(f, "utf-8");
    });
    e.target.value = "";
  };

  document.getElementById("q").oninput = function (e) {
    query = e.target.value.trim();
    render();
  };

  document.getElementById("tabs").onclick = function (e) {
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    cur = parseInt(b.getAttribute("data-tab"), 10);
    query = ""; document.getElementById("q").value = "";
    render(); window.scrollTo(0, 0);
  };

  document.getElementById("chips").onclick = function (e) {
    var b = e.target.closest("[data-chip]");
    if (!b) return;
    query = b.getAttribute("data-chip");
    document.getElementById("q").value = query;
    render();
  };

  document.getElementById("main").onclick = function (e) {
    var yb = e.target.closest("[data-year]");
    if (yb) {
      var k = yb.getAttribute("data-year");
      openYears[k] = !openYears[k];
      var target = document.getElementById("m" + k);
      if (target) target.innerHTML = itemHtml(wikis[cur].items.filter(function (o) {
        return (o.si + "_" + o.ii) === k;
      })[0], [], false);
      if (openYears[k] && target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    var a = e.target.closest("a[href^='#']");
    if (a) {
      var el = document.getElementById(a.getAttribute("href").slice(1));
      if (el) { e.preventDefault(); el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    }
  };

  function setFs(v) {
    fs = Math.max(12, Math.min(26, v));
    try { localStorage.setItem("mfw_fs", String(fs)); } catch (e) {}
    document.getElementById("main").style.fontSize = fs + "px";
  }
  document.getElementById("fsDown").onclick = function () { setFs(fs - 1); };
  document.getElementById("fsUp").onclick = function () { setFs(fs + 1); };

  document.getElementById("rmBtn").onclick = function () {
    if (cur < 0 || !wikis[cur]) return;
    if (!confirm("Bu wiki kütüphaneden kaldırılsın mı? (Orijinal dosyanız silinmez.)")) return;
    wikis.splice(cur, 1);
    cur = Math.min(cur, wikis.length - 1);
    saveLib();
    render();
  };

  loadLib();
  render();
})();
</script>
</body>
</html>
